name: Publish package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run build
          npm run lint
          npm run export:themes
          git diff --check
          git ls-files | grep -E '^(node_modules|dist/|\.DS_Store)' && exit 1 || true

      - name: Publish
        run: npm publish --access public --provenance
